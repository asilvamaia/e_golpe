name: Build Mobile Apps (Android APK & iOS AltStore IPA)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar uma Release no GitHub com os arquivos compilados?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: COMPILAÇÃO ANDROID (APK & AAB)
  # ==========================================
  build-android:
    name: Compilar Android (APK / AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do App
        working-directory: mobile_app
        run: flutter pub get

      - name: Executar Testes
        working-directory: mobile_app
        run: flutter test

      - name: Compilar APK de Release (Universal)
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Compilar App Bundle (Google Play AAB)
        working-directory: mobile_app
        run: flutter build appbundle --release

      - name: Renomear Arquivos de Saída
        run: |
          mkdir -p output/android
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk output/android/egolpe-android-release.apk
          cp mobile_app/build/app/outputs/bundle/release/app-release.aab output/android/egolpe-android-release.aab

      - name: Upload do Artefato Android (APK)
        uses: actions/upload-artifact@v4
        with:
          name: egolpe-android-apk
          path: output/android/egolpe-android-release.apk
          retention-days: 30

      - name: Upload do Artefato Android (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: egolpe-android-aab
          path: output/android/egolpe-android-release.aab
          retention-days: 30

  # ==========================================
  # JOB 2: COMPILAÇÃO iOS (IPA PARA ALTSTORE)
  # ==========================================
  build-ios:
    name: Compilar iOS (.IPA para AltStore / Sideloading)
    runs-on: macos-14

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do App
        working-directory: mobile_app
        run: flutter pub get

      - name: Compilar iOS Release (Sem Assinatura / Para Sideload)
        working-directory: mobile_app
        run: flutter build ios --release --no-codesign

      - name: Empacotar Payload e Gerar .IPA para AltStore / Sideloadly
        run: |
          mkdir -p output/ios
          mkdir -p build_ipa/Payload
          cp -r mobile_app/build/ios/iphoneos/Runner.app build_ipa/Payload/
          cd build_ipa
          zip -qr ../output/ios/egolpe-ios-altstore.ipa Payload
          cd ..
          echo "IPA para AltStore gerado com sucesso!"
          ls -lh output/ios/egolpe-ios-altstore.ipa

      - name: Upload do Artefato iOS (IPA AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: egolpe-ios-altstore-ipa
          path: output/ios/egolpe-ios-altstore.ipa
          retention-days: 30

  # ==========================================
  # JOB 3: CRIAR RELEASE (OPCIONAL / TAGS)
  # ==========================================
  release:
    name: Publicar Release no GitHub
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar APK do Android
        uses: actions/download-artifact@v4
        with:
          name: egolpe-android-apk
          path: release_files

      - name: Baixar IPA do iOS
        uses: actions/download-artifact@v4
        with:
          name: egolpe-ios-altstore-ipa
          path: release_files

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_files/egolpe-android-release.apk
            release_files/egolpe-ios-altstore.ipa
